name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v
      - run: python divine_whisper_v5_eternal_orchestrator.py --compare-anchor --steps 8 --out-dir artifacts > /dev/null
